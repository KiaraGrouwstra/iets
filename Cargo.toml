[package]
name = "ietsp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ietsp"
path = "src/main.rs"


[dependencies]
sha2 = "0.10"
blake3 = "1"
sha1 = "0.10"
md-5 = "0.10"
libc = "0.2"
regex = "1"
toml = "1"
serde_json = "1"

[features]
# Memory census behind IETSP_STATS=2 (docs/memory.md); off the hot path when unset.
stats2 = []

[build-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

[profile.bench]
inherits = "release"
