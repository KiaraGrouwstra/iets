[package]
name = "ietsp"
version = "0.1.0"
license = "LGPL-2.1-or-later"
edition = "2024"

[[bin]]
name = "ietsp"
path = "src/main.rs"


[dependencies]
sha2 = "0.10"
blake3 = "1"
sha1 = "0.10"
md-5 = "0.10"
libc = "0.2"
toml = "1"
serde_json = "1"
tonic = { version = "0.14", default-features = false, features = ["codegen", "channel", "transport", "tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
zstd = "0.13"
# The flake-input fetcher (src/flake/http.rs, src/flake/unpack.rs): the HTTP and
# TLS halves are the ones tonic already brings; only the archive formats are new.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tar = { version = "0.4", default-features = false }
flate2 = "1"
lzma-rust2 = { version = "0.16", default-features = false, features = ["std", "xz"] }
bzip2 = "0.6"

[features]
# Memory census behind IETSP_STATS=2 (docs/memory.md); off the hot path when unset.
stats2 = []

[build-dependencies]
sha2 = "0.10"
tonic-prost-build = "0.14"
protox = "0.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

[profile.bench]
inherits = "release"
