// ietsp remote builder protocol, v2. Transport-agnostic: this file defines
// messages and one service; the reference carries it over gRPC/HTTP2
// cleartext. Content is addressed by amber-store keys (src/amber/), so an
// amber-hostd holding the same objects could serve Put and Have directly.
syntax = "proto3";

package ietsp.builder.v2;

service Builder {
  // One batch: which of these object keys and store paths does the builder lack?
  rpc Have(HaveRequest) returns (HaveResponse);
  // One stream: every missing object, then the manifests and drvs that need them.
  rpc Put(stream PutRequest) returns (PutResponse);
  // One request; the builder streams events until Done.
  rpc Build(BuildRequest) returns (stream BuildEvent);
  // Optional: pull a store path back as a NAR in pieces.
  rpc Fetch(FetchRequest) returns (stream NarChunk);
}

// One amber object: `key` is the 32-byte amber key (type nibble, logical
// length, truncated BLAKE3 of `data`). A Blob is raw file bytes (at most 64
// KiB, the chunker's ceiling); a FileNode, DirLeaf or DirNode is
// deterministic CBOR. The builder recomputes the key and rejects a mismatch.
message Object {
  bytes key = 1;
  bytes data = 2;
}

// Several objects in one message; the client fills a batch to about 1 MiB.
message ObjectBatch {
  repeated Object objects = 1;
}

// How a store path was content-addressed; decides how the builder derives
// and checks `store_path`.
enum ContentAddress {
  SOURCE = 0; // recursive sha256 of the NAR, no references (`./path`, fetchTarball)
  TEXT = 1;   // flat sha256 of one regular file, with references (builtins.toFile)
}

// A source tree as an amber object graph. Addressed by its store path. The
// builder restores the tree from `root`, hashes the NAR, and recomputes
// `store_path` under the Nix rules for `ca`; a mismatch is rejected.
message Manifest {
  string store_path = 1; // /nix/store/<hash>-<name>
  bytes nar_hash = 2;    // sha256 of the NAR, 32 bytes, for the Nix side
  uint64 nar_size = 3;
  ContentAddress ca = 4;
  repeated string references = 5; // TEXT only: store paths the file refers to
  // The top-level node. A directory: `root` is a DirLeaf or DirNode key. A
  // regular file: a Blob or FileNode key plus `executable`. A symlink:
  // `root` is empty and `symlink_target` is set.
  bytes root = 6;
  bool executable = 7;
  string symlink_target = 8;
  // Every object key the tree needs, root included, children before
  // parents; the builder checks it holds each one before it accepts the
  // manifest.
  repeated bytes keys = 9;
}

// A derivation. Its identity is its store path; its ATerm bytes are a file
// object (Blob or FileNode) under `content`. The builder reads the ATerm,
// parses it, and checks that it hashes to `drv_path`.
message DrvBlob {
  string drv_path = 1; // /nix/store/<hash>-<name>.drv
  bytes content = 2;   // amber key of the ATerm file object
}

message HaveRequest {
  repeated bytes keys = 1;   // amber object keys
  repeated string paths = 2; // store paths of manifests and drvs
}

message HaveResponse {
  repeated bytes missing_keys = 1;
  repeated string missing_paths = 2;
}

message PutRequest {
  oneof body {
    ObjectBatch objects = 1;
    Manifest manifest = 2;
    DrvBlob drv = 3;
  }
}

message PutResponse {
  uint64 objects = 1; // objects stored
  uint64 paths = 2;   // manifests and drvs stored
}

message BuildRequest {
  string root_drv_path = 1;
  repeated string outputs = 2; // empty means all
  bool keep_going = 3;
  int32 priority = 4;
}

message BuildEvent {
  oneof event {
    Scheduled scheduled = 1;
    Started started = 2;
    Log log = 3;
    Built built = 4;
    Failed failed = 5;
    Done done = 6;
  }
}

message Scheduled {
  repeated string drv_paths = 1; // what the builder will build
}

message Started {
  string drv_path = 1;
}

message Log {
  string drv_path = 1; // empty when not attributed to one build
  bytes line = 2;
}

message Built {
  string drv_path = 1;
  string output = 2;
  string store_path = 3;
  string signature = 4; // empty in v2
}

message Failed {
  string drv_path = 1;
  string reason = 2;
}

message Done {
  bool success = 1;
}

message FetchRequest {
  string store_path = 1;
}

// A piece of a NAR, at most 4 MiB, in stream order.
message NarChunk {
  bytes data = 1;
}
