[package]
name = "iets-fuzz"
version = "0.0.0"
license = "LGPL-2.1-or-later"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
iets = { path = ".." }
libfuzzer-sys = "0.4"
serde_json = "1"
toml = "1"
sha2 = "0.10"
libc = "0.2"

[[bin]]
name = "nar-read"
path = "fuzz_targets/nar_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nar-gen"
path = "fuzz_targets/nar_gen.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nar-tree"
path = "fuzz_targets/nar_tree.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-diff"
path = "src/bin/fuzz-diff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "conformance-adapter"
path = "src/bin/conformance-adapter.rs"
test = false
doc = false
bench = false

# not a member of the iets workspace: cargo-fuzz builds it with its own flags
[workspace]
