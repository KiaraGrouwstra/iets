[package]
name = "iets-fuzz"
version = "0.0.0"
license = "LGPL-2.1-or-later"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
iets = { path = ".." }
libfuzzer-sys = "0.4"
serde_json = "1"
toml = "1"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse-diff"
path = "src/bin/parse-diff.rs"
test = false
doc = false
bench = false

# not a member of the iets workspace: cargo-fuzz builds it with its own flags
[workspace]
